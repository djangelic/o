<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Open in Obsidian</title>
<style>
  :root { --bg:#f7f7f8; --fg:#1d1d1f; --muted:#6e6e73; --btn:#7c3aed; --btnfg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --fg:#f2f2f4; --muted:#9a9aa2; --btn:#8b5cf6; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  a.btn { display:inline-block; margin-top:16px; padding:14px 22px; border-radius:12px; background:var(--btn); color:var(--btnfg);
          text-decoration:none; font-weight:600; font-size:17px; }
  p { color:var(--muted); word-break:break-word; }
</style>
</head>
<body>
<main>
  <h1 id="h">Opening Obsidian…</h1>
  <p id="name"></p>
  <a class="btn" id="go" href="#" hidden>Open in Obsidian</a>
  <p id="why" hidden>This link only opens notes in Angel's Obsidian vaults.</p>
</main>
<script>
// Door from an https link to an obsidian:// deep link. The target rides in the #fragment,
// which browsers never send to the server, so note names stay off GitHub's logs.
// Only Obsidian links to the two known vaults are followed: this is not an open redirect.
(function () {
  var raw = location.hash.slice(1), uri = "";
  try { uri = decodeURIComponent(raw); } catch (e) { uri = ""; }
  var ok = /^obsidian:\/\/(advanced-uri|open)\?vault=(Agent(%20| )Workspace|Cerebro)(&|$)/.test(uri);
  var h = document.getElementById("h"), go = document.getElementById("go");
  if (!ok) { h.textContent = "Not a link this page opens"; document.getElementById("why").hidden = false; return; }
  var m = uri.match(/[?&](filepath|file)=([^&]*)/);
  if (m) { try { document.getElementById("name").textContent = decodeURIComponent(m[2]).split("/").pop().replace(/\.md$/, ""); } catch (e) {} }
  go.href = uri; go.hidden = false;
  location.replace(uri);
  setTimeout(function () { h.textContent = "Tap to open"; }, 1200);
})();
</script>
</body>
</html>
